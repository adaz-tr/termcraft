name: Feature Request
description: Suggest an idea or enhancement for TermCraft
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: Detailed explanation of how this feature should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Additional context or mockups
