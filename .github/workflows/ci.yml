name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# okuma yeterli, CI hicbir sey yazmiyor
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # 3.14 tekerlekleri her bagimlilik icin hazir olmayabiliyor,
        # kirilirsa butun matrisi kirmasin
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            experimental: true
          - os: windows-latest
            python-version: "3.14"
            experimental: true

    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # testler HOME'u tests/conftest.py'deki fixture ile izole ediyor,
      # runner'in kendi dosyalarina dokunmuyorlar
      - name: Run pytest test suite
        run: pytest -v

  smoke:
    name: CLI smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      # paketlenmis komutlarin gercekten calistigini dogrula
      - name: Run CLI commands
        shell: bash
        run: |
          termcraft --version
          termcraft theme list
          termcraft prompt list
          termcraft tools list
          termcraft doctor
          tc --version
