[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "termcraft"
dynamic = ["version"]
description = "Universal Terminal & CLI Customization, Theming, Profiling and Management Suite"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Rival Development - imp0rt" }
]
keywords = [
    "terminal",
    "cli",
    "powershell",
    "bash",
    "zsh",
    "fish",
    "nushell",
    "starship",
    "oh-my-posh",
    "themes",
    "tui",
    "windows-terminal",
    "alacritty",
    "wezterm"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Shells",
    "Topic :: Terminals",
    "Topic :: Utilities"
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.70.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.8"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0"
]

[project.scripts]
termcraft = "termcraft.cli:main"
tc = "termcraft.cli:main"

[project.urls]
Homepage = "https://github.com/adaz-tr/termcraft"
Repository = "https://github.com/adaz-tr/termcraft"
Issues = "https://github.com/adaz-tr/termcraft/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/termcraft"]

# surum tek kaynaktan okunuyor, uc yerde ayri ayri tutmuyoruz
[tool.hatch.version]
path = "src/termcraft/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
# F401 kullanilmayan import, F841 kullanilmayan degisken, E7xx temel stil
select = ["E4", "E7", "E9", "F"]
# E402: cli.py'de windows konsol kurulumu import'lardan ONCE calismak zorunda
ignore = ["E402"]
